# Actualiza presas (SIH) y sequía (SMN) y, si cambió algo, lo sube a main. Vercel publica solo con cada push.
# Los acuíferos (DOF) no se automatizan: cambian cada 2–3 años; ver README.

name: Actualizar datos

on:
  schedule:
    - cron: "0 14 * * 1,4" # lunes y jueves, 8:00 en la Ciudad de México
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Descargar presas (SIH, a diario)
        run: bash scripts/fetch_sih.sh

      - name: Descargar sequía (SMN, cada quincena)
        run: bash scripts/fetch_sequia.sh

      # Ambos scripts se detienen sin escribir nada si los datos nuevos son más viejos que los publicados.
      - name: Procesar presas
        run: python3 -I scripts/build_presas.py

      - name: Procesar sequía y agua por persona
        run: python3 -I scripts/build_agua.py

      - name: ¿Cambió algo?
        id: cambios
        run: |
          if git diff --quiet -- public/data src/data; then
            echo "hay=false" >> "$GITHUB_OUTPUT"
            echo "Sin datos nuevos."
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- public/data src/data | tail -3
          fi

      # Antes de publicar, el sitio debe compilar con los datos nuevos.
      - name: Verificar que el sitio compila
        if: steps.cambios.outputs.hay == 'true'
        run: |
          npm ci
          npm run build

      - name: Subir los datos nuevos
        if: steps.cambios.outputs.hay == 'true'
        run: |
          presas=$(python3 -c "import json;print(json.load(open('src/data/presas_resumen.json'))['ultima'])")
          sequia=$(python3 -c "import json;print(json.load(open('src/data/agua.json'))['sequia']['actual']['f'])")
          git config user.name "sinagua-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data src/data
          git commit -m "Datos: presas al $presas, sequía al $sequia"
          git push
